<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181c">
<title>Relevamiento de instalaciones</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<header class="barra">
  <h1>Relevamiento</h1>
  <span class="quien" id="quien"></span>
  <button class="estado" id="sincronizar" type="button">
    <span class="punto" id="punto"></span>
    <span id="estadoTxt">Al día</span>
  </button>
</header>

<div class="aviso malo" id="fatal" hidden></div>

<!-- Alta del relevador -->
<section class="portada" id="portada" hidden>
  <h2>¿Quién está relevando?</h2>
  <p>Tu nombre queda guardado en cada registro que cargues.</p>
  <select id="selectorRelevador" aria-label="Relevador"></select>
  <input id="nombreManual" type="text" placeholder="O escribí tu nombre" hidden
         autocomplete="off" aria-label="Nombre del relevador">
  <button class="boton" id="entrar" type="button">Empezar</button>

  <div class="aviso" id="avisoPortada" hidden>
    <b>No hay relevadores cargados</b>
    Agregá los nombres en la hoja «relevadores» de la planilla y volvé a sincronizar,
    o escribí tu nombre acá arriba para probar.
  </div>

  <button class="boton tenue" id="revisar" type="button"
          style="width:100%;margin-top:22px">Revisar configuración</button>
  <pre id="diagnostico" hidden></pre>
</section>

<!-- Pantalla principal -->
<div id="principal" hidden>
  <nav class="pestanias" role="tablist">
    <button class="pestania" type="button" role="tab" data-solapa="cerca"
            aria-selected="true">Cerca mío</button>
    <button class="pestania" type="button" role="tab" data-solapa="buscar"
            aria-selected="false">Buscar</button>
  </nav>

  <div class="buscar" id="cajaBuscar" hidden>
    <input id="entrada" type="search" inputmode="search" autocomplete="off"
           placeholder="Número de inventario o calles">
  </div>

  <main>
    <p class="pista" id="pista" style="padding:0 14px"></p>
    <ul class="lista" id="lista"></ul>
  </main>
</div>

<script src="posgar.js"></script>
<script src="config.js"></script>
<script src="almacen.js"></script>
<script src="buscador.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
